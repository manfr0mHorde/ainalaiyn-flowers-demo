name: Unpack Ainalaiyn static demo
on:
  push:
    branches: [main]
    paths:
      - '.bundle/**'
      - '.github/workflows/unpack-demo.yml'
permissions:
  contents: write
jobs:
  publish-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract prepared site and generate illustrative artwork
        run: |
          cat .bundle/part-* | base64 --decode | tar -xJf -
          python3 generate_art.py
          rm -rf .bundle generate_art.py
      - name: Commit site files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Ainalaiyn Flowers storefront demo' || exit 0
          git push
